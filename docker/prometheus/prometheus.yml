global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'backend-nestjs'
    static_configs:
      - targets:
          - host.docker.internal:3001
    metrics_path: /metrics

  - job_name: 'api-ia-fastapi'
    static_configs:
      - targets:
          - host.docker.internal:8000
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: 'docker-daemon'
    static_configs:
      - targets:
          - host.docker.internal:9323

