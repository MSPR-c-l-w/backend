server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
    pipeline_stages:
      # Parser NestJS (format: [Nest] PID  LOG_LEVEL [context] message)
      - regex:
          expression: '^\[Nest\]\s+\d+\s+-\s+\d{2}/\d{2}/\d{4},\s+[\d:,\s]+(?P<level>LOG|ERROR|WARN|DEBUG|VERBOSE)'
      - labels:
          level:
      # Parser FastAPI / uvicorn
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+)\s+(?P<level>INFO|WARNING|ERROR|CRITICAL)'
      - labels:
          level:
