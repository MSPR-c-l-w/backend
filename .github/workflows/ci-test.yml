name: CI — Tests (Unit & Coverage)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          short_sha="$(echo "$SHA" | cut -c1-7)"
          if [ "$JOB_STATUS" = "success" ]; then
            color=5763719; title="✅ Tests unitaires OK"
          elif [ "$JOB_STATUS" = "failure" ]; then
            color=15548997; title="❌ Tests unitaires en échec"
          else
            color=16705372; title="⚠️ Tests unitaires — statut: $JOB_STATUS"
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$title\",
              \"color\": $color,
              \"fields\": [
                {\"name\": \"Branche\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"$short_sha\", \"inline\": true},
                {\"name\": \"Actor\", \"value\": \"$ACTOR\", \"inline\": true},
                {\"name\": \"Logs\", \"value\": \"[Voir le workflow]($RUN_URL)\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }"
