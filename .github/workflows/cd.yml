name: CD — Docker Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy — vulnérabilités critiques)
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          short_sha="$(echo "$SHA" | cut -c1-7)"
          if [ "$JOB_STATUS" = "success" ]; then
            color=5763719; title="✅ Docker Build OK"
          elif [ "$JOB_STATUS" = "failure" ]; then
            color=15548997; title="❌ Docker Build en échec"
          else
            color=16705372; title="⚠️ Docker Build — statut: $JOB_STATUS"
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$title\",
              \"color\": $color,
              \"fields\": [
                {\"name\": \"Branche\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Image\", \"value\": \"backend:$short_sha\", \"inline\": true},
                {\"name\": \"Actor\", \"value\": \"$ACTOR\", \"inline\": true},
                {\"name\": \"Logs\", \"value\": \"[Voir le workflow]($RUN_URL)\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }"
