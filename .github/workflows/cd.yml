name: CD — Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Dokploy
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DOKPLOY_WEBHOOK_URL:-}" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL non configuré — déploiement ignoré"
            exit 0
          fi
          curl -sS --fail -X POST "$DOKPLOY_WEBHOOK_URL"

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          short_sha="$(echo "$SHA" | cut -c1-7)"
          if [ "$JOB_STATUS" = "success" ]; then
            color=5763719; title="🚀 Déployé en production"
          elif [ "$JOB_STATUS" = "failure" ]; then
            color=15548997; title="❌ Déploiement en production en échec"
          else
            color=16705372; title="⚠️ Déploiement — statut: $JOB_STATUS"
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$title\",
              \"color\": $color,
              \"fields\": [
                {\"name\": \"Branche\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"$short_sha\", \"inline\": true},
                {\"name\": \"Actor\", \"value\": \"$ACTOR\", \"inline\": true},
                {\"name\": \"Logs\", \"value\": \"[Voir le workflow]($RUN_URL)\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }"
