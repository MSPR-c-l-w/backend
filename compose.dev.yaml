services:
  mariadb:
    image: mariadb:latest
    container_name: backend-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: backend_db
      MYSQL_USER: backend_user
      MYSQL_PASSWORD: backend_password
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: backend-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - '8080:80'
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend-network

  # Stockage objet S3 (buckets photos/vidéos des publications)
  minio:
    image: minio/minio:latest
    container_name: backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # Console web MinIO
    volumes:
      - minio_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialise le bucket et le rend lisible publiquement (lecture des médias)
  minio-init:
    image: minio/mc:latest
    container_name: backend-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'En attente de MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/posts-media;
      /usr/bin/mc anonymous set download local/posts-media;
      echo 'Bucket posts-media prêt (lecture publique).';
      exit 0;
      "
    networks:
      - backend-network

volumes:
  mariadb_data:
    driver: local
  minio_data:
    driver: local

networks:
  backend-network:
    driver: bridge
